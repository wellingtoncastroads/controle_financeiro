name: Diagnose V2.7 Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture full apply log
        shell: bash
        run: |
          set +e
          npm run predev > v27-build.log 2>&1
          code=$?
          echo "exit_code=$code" >> v27-build.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: v27-build-log
          path: v27-build.log
          retention-days: 1
