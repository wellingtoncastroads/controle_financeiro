name: Validate Folego V2.5

on:
  push:
    branches:
      - agent/folego-v25-suite
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Apply interface
        run: npm run prebuild
      - name: Validate HTML
        run: npm run validate:html
      - name: Run tests
        run: npm test
      - name: Build Vite
        run: npx vite build
