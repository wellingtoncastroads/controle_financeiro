name: Validate Folego V2.5

on:
  push:
    branches:
      - agent/folego-v25-suite
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Apply interface
        run: npm run prebuild
      - name: Validate HTML
        shell: bash
        run: |
          set +e
          npx html-validate index.html --formatter json > html-report.json 2>&1
          code=$?
          echo "$code" > html-exit-code.txt
          exit 0
      - name: Upload HTML diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: html-diagnostic
          path: |
            html-report.json
            html-exit-code.txt
            index.html
      - name: Stop on invalid HTML
        shell: bash
        run: test "$(cat html-exit-code.txt)" = "0"
      - name: Run tests
        run: npm test
      - name: Build Vite
        run: npx vite build
